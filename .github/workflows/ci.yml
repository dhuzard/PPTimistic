name: Local presentation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for collaboration browser tests
        if: runner.os == 'Linux' && matrix.node == '22.13'
        run: npx playwright install --with-deps chromium
      - name: Install Linux render tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libreoffice-impress-nogui poppler-utils
      - run: npm run check
      - run: npm run demo -- --no-render
      - run: npm run validate -- --project demo
      - name: Render public typography QA fixture with LibreOffice
        if: runner.os == 'Linux' && matrix.node == '22.13'
        run: npx tsx tests/fixtures/render-typography.ts qa-artifacts libreoffice
      - name: Upload public visual QA fixture and manifest
        if: runner.os == 'Linux' && matrix.node == '22.13'
        uses: actions/upload-artifact@v4
        with:
          name: public-visual-qa
          path: |
            qa-artifacts/**/*.png
            qa-artifacts/qa-manifest.json
          retention-days: 7
          if-no-files-found: error
