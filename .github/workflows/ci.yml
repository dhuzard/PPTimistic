name: Local presentation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo -- --no-render
      - run: npm run validate -- --project demo
      - name: Install Linux render tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libreoffice-impress-nogui poppler-utils
      - name: Render demo with LibreOffice
        if: runner.os == 'Linux'
        run: |
          npm run render -- --project demo --renderer libreoffice
          node -e "const fs=require('node:fs');for(const locale of ['en-US','fr-FR']){const latest=JSON.parse(fs.readFileSync('projects/demo/output/previews/'+locale+'/latest.json','utf8'));const files=fs.readdirSync(latest.folder);if(files.filter(f=>/^slide-\d+\.png$/.test(f)).length!==5||!files.includes('contact-sheet.png')||!files.includes('presentation.'+locale+'.pdf'))process.exit(1)}"
